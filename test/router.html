<html lang="en">
<head>

  <title>Oak Router</title>
  <style>
    body { font-family: sans-serif; max-width: 34rem; margin: 3rem auto; line-height: 1.5; }

    nav a { color: #2e6b4f; }
    h1 { font-size: 1.4rem; margin-bottom: 0; }
